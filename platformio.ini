; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = lolin_d32

[env:lolin_d32]
platform = espressif32
board = lolin_d32
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson

[env:lolin_d32_secure]
extends = env:lolin_d32
platform = espressif32@6.13.0
build_flags = -DEDOL_AGENT_SECURE_BUILD=1
extra_scripts = pre:scripts/secure_trust.py

[env:lolin_d32_secure_smoke]
extends = env:lolin_d32_secure
build_flags = ${env:lolin_d32_secure.build_flags} -DEDOL_AGENT_SMOKE_BUILD=1
